# Render.com blueprint — https://render.com/docs/blueprint-spec
# Lets Render auto-configure this as a web service when you connect the repo
# via "New +" → "Blueprint" and point it at this repository.
#
# NOTE on persistence: the free plan has no persistent disk, so
# server/data/content.json and server/uploads/ reset to what's in this repo
# on every redeploy (day-to-day edits via /?edit are safe — they only get
# wiped by a *redeploy*, not by the service idling/waking). If that matters
# to you, upgrade `plan` below to `starter` (or higher) and uncomment the
# `disk` block to get a real persistent volume.
services:
  - type: web
    name: yeowon-jie-site
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: EDIT_PASSWORD
        sync: false # set this yourself in the Render dashboard — don't commit it
    # disk:
    #   name: site-data
    #   mountPath: /opt/render/project/src/server/data
    #   sizeGB: 1
